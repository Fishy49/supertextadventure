name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supertextadventure_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/supertextadventure_test
      PARALLEL_WORKERS: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up database
        run: bin/rails db:schema:load

      - name: Run tests
        run: bin/rails test

      # Chrome >= 151 breaks ferrum 0.17.2 CDP node resolution (every system
      # test errors with Ferrum::NodeNotFoundError). Pin to the last known-good
      # major until a ferrum release supports newer Chrome.
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "150"

      - name: Run system tests
        run: bin/rails test:system
        env:
          HEADLESS: "true"
          BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run RuboCop
        run: bundle exec rubocop --parallel
