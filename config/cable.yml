# Solid Cable stores broadcasts in the primary Postgres database (no separate
# cable database, no Redis). Subscribers poll for new messages.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: async

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
