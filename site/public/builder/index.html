<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>World Builder - Super Text Adventure</title>
  <meta name="description" content="Build a Classic Game Engine world in your browser: map, rooms, items, characters, creatures, and live validation. Works offline; open and save world JSON files.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <style>
/* STA World Builder. Three panes: entity browser, map/flags/json/problems, schema-aware inspector.
   Dark-first; the Rails layout pins data-theme="dark". */
:root {
  --bg: #1e1e1a;
  --panel: #282823;
  --panel-2: #31312a;
  --panel-3: #3a3a32;
  --line: #41413a;
  --fg: #dce9d2;
  --fg-dim: #8f9c86;
  --accent: #8fe86b;
  --accent-dim: #5a9e3d;
  --accent-bright: #b5f5a0;
  --accent-soft: rgba(143, 232, 107, 0.12);
  --c-room: #7cc4ff;
  --c-item: #d3a6ff;
  --c-npc: #5fe3d6;
  --c-creature: #ff8b7a;
  --c-flag: #ffd76a;
  --err: #ff6b6b;
  --warn: #ffc857;
  --ok: #8fe86b;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --font-display: 'VT323', 'Courier New', monospace;
  --font-body: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0e6; --panel: #f7f8f2; --panel-2: #e5e8db; --panel-3: #d9ddcc; --line: #c9cfbb;
    --fg: #1f2a18; --fg-dim: #5f6b55; --accent: #2f7d1f; --accent-dim: #4d9a3a; --accent-bright: #1e5a12;
    --accent-soft: rgba(47,125,31,.12);
    --c-room: #1f6fb5; --c-item: #7a3fc9; --c-npc: #0f8f85; --c-creature: #c9402f; --c-flag: #a1730a;
    --err: #c92f2f; --warn: #a1730a; --ok: #2f7d1f; --shadow: 0 10px 30px rgba(40,50,30,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0e6; --panel: #f7f8f2; --panel-2: #e5e8db; --panel-3: #d9ddcc; --line: #c9cfbb;
  --fg: #1f2a18; --fg-dim: #5f6b55; --accent: #2f7d1f; --accent-dim: #4d9a3a; --accent-bright: #1e5a12;
  --accent-soft: rgba(47,125,31,.12);
  --c-room: #1f6fb5; --c-item: #7a3fc9; --c-npc: #0f8f85; --c-creature: #c9402f; --c-flag: #a1730a;
  --err: #c92f2f; --warn: #a1730a; --ok: #2f7d1f; --shadow: 0 10px 30px rgba(40,50,30,.18);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
.wb-host { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 13px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 26px; color: var(--accent); line-height: 1; letter-spacing: .5px; white-space: nowrap; }
.brand .cursor { display: inline-block; width: .55em; height: .9em; background: var(--accent); vertical-align: -0.1em; margin-left: 3px; animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.worldname { font-family: var(--font-display); font-size: 22px; color: var(--fg); background: transparent; border: 1px solid transparent; padding: 2px 8px; min-width: 120px; max-width: 34vw; border-radius: 3px; }
.worldname:hover, .worldname:focus { border-color: var(--line); background: var(--bg); outline: none; }
.spacer { flex: 1; }
.toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.btn { font-size: 12px; padding: 5px 10px; border: 1px solid var(--accent-dim); background: transparent; color: var(--accent); cursor: pointer; border-radius: 3px; line-height: 1.2; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--accent); color: var(--bg); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:disabled:hover { background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--bg); font-weight: 600; }
.btn.primary:hover { background: var(--accent-bright); }
.btn.ghost { border-color: var(--line); color: var(--fg-dim); }
.btn.ghost:hover { color: var(--fg); background: var(--panel-2); }
.btn.danger { border-color: var(--err); color: var(--err); }
.btn.danger:hover { background: var(--err); color: #fff; }
.btn.sm { font-size: 11px; padding: 3px 7px; }
.btn.active { background: var(--accent-soft); }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--panel-3); color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.badge.err { background: var(--err); color: #fff; }
.badge.warn { background: var(--warn); color: #201a05; }
.badge.ok { background: var(--accent-soft); color: var(--accent); }

/* Main grid */
.main { flex: 1; display: grid; grid-template-columns: 272px minmax(0, 1fr) 420px; min-height: 0; }
.sidebar, .center, .inspector { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.sidebar { border-right: 1px solid var(--line); background: var(--panel); }
.inspector { border-left: 1px solid var(--line); background: var(--panel); }
.scroll { overflow: auto; flex: 1; min-height: 0; }
.pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.pane-title { font-family: var(--font-display); font-size: 20px; color: var(--accent); letter-spacing: .4px; line-height: 1; }

/* Sidebar */
.search { margin: 8px 12px; }
.in { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0; }
.in:focus { border-color: var(--accent-dim); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.in.err { border-color: var(--err); }
textarea.in { resize: vertical; min-height: 64px; line-height: 1.45; }
select.in { appearance: auto; }
.section { border-bottom: 1px solid var(--line); }
.section-head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; user-select: none; }
.section-head:hover { background: var(--panel-2); }
.section-head .caret { color: var(--fg-dim); font-size: 10px; width: 10px; transition: transform .15s; }
.section.collapsed .caret { transform: rotate(-90deg); }
.section.collapsed .rows { display: none; }
.section-name { font-family: var(--font-display); font-size: 19px; letter-spacing: .4px; line-height: 1; }
.section-head .badge { margin-left: auto; }
.rows { padding-bottom: 4px; }
.row { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 18px; cursor: pointer; border-left: 3px solid transparent; }
.row:hover { background: var(--panel-2); }
.row.selected { background: var(--accent-soft); border-left-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .id { color: var(--fg-dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
.row .mark { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.row .mark.err { background: var(--err); }
.row .mark.warn { background: var(--warn); }
.empty { color: var(--fg-dim); padding: 6px 18px; font-size: 12px; font-style: italic; }
.t-room { color: var(--c-room); } .t-item { color: var(--c-item); } .t-npc { color: var(--c-npc); } .t-creature { color: var(--c-creature); } .t-flag { color: var(--c-flag); } .t-meta { color: var(--accent); }
.bg-room { background: var(--c-room); } .bg-item { background: var(--c-item); } .bg-npc { background: var(--c-npc); } .bg-creature { background: var(--c-creature); } .bg-flag { background: var(--c-flag); } .bg-meta { background: var(--accent); }

/* In-house picker (replaces every native select) */
.pick { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; cursor: pointer; min-width: 0; }
.pick:hover { border-color: var(--accent-dim); }
.pick:focus-visible { border-color: var(--accent-dim); box-shadow: 0 0 0 2px var(--accent-soft); outline: none; }
.pick .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick.empty .val { color: var(--fg-dim); }
.pick .caret { color: var(--fg-dim); font-size: 11px; flex: none; }
.pick .dot { flex: none; }
.pickpop { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--accent-dim); border-radius: 4px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.pickpop .in { border-radius: 0; border: none; border-bottom: 1px solid var(--line); background: var(--panel); }
.pickpop .in:focus { box-shadow: none; }
.pickpop .list { overflow: auto; flex: 1; min-height: 0; max-height: 280px; padding: 4px 0; }
.pickrow { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.pickrow.hi { background: var(--accent-soft); }
.pickrow .lab { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickrow .sub { color: var(--fg-dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickrow .meta { margin-left: auto; color: var(--fg-dim); font-size: 11px; flex: none; }
.pickrow.current .lab { color: var(--accent); }
.pickrow.action { color: var(--accent); }
.pickrow.none { color: var(--fg-dim); font-style: italic; }
.pickrow.dim { color: var(--fg-dim); cursor: default; }
.pickpop.sheet { left: 0 !important; right: 0; bottom: 0 !important; top: auto !important; width: auto !important; max-height: 70vh !important; border-radius: 8px 8px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.pickpop.sheet .list { max-height: none; }

/* Sidebar type filter */
.filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px 0; }
.fchip { font-family: var(--font-display); font-size: 15px; letter-spacing: .4px; padding: 2px 8px; border: 1px solid var(--line); background: transparent; border-radius: 3px; cursor: pointer; line-height: 1.2; }
.fchip:not(.active) { color: var(--fg-dim); }
.fchip.active { border-color: currentColor; background: var(--accent-soft); }
.fchip[data-type=""].active { color: var(--accent); }
.fchip[data-type="problems"].active { color: var(--warn); }
.fchip:hover { border-color: var(--accent-dim); }

.draftbanner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--warn); background: var(--panel); color: var(--fg); font-size: 12.5px; }

/* Center tabs */
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); background: var(--panel); align-items: flex-end; }
.tab { font-family: var(--font-display); font-size: 19px; padding: 5px 12px; border: 1px solid transparent; border-bottom: none; color: var(--fg-dim); background: transparent; cursor: pointer; border-radius: 4px 4px 0 0; line-height: 1; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--fg); }
.tab.active { color: var(--accent); border-color: var(--line); background: var(--bg); margin-bottom: -1px; }
.tabpane { display: none; flex: 1; min-height: 0; flex-direction: column; }
.tabpane.active { display: flex; }

/* Map */
.map-tools { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 12px; color: var(--fg-dim); }
.map-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--bg); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 24px 24px; }
.map-wrap svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.map-wrap svg.panning { cursor: grabbing; }
.map-wrap svg.connect { cursor: crosshair; }
.node { cursor: pointer; }
.node rect.box { fill: var(--panel-2); stroke: var(--c-room); stroke-width: 1.2; }
.node:hover rect.box { fill: var(--panel-3); }
.node.selected rect.box { stroke: var(--accent); stroke-width: 2.5; }
.node.start rect.box { stroke-width: 2; }
.node.unreachable rect.box { stroke-dasharray: 4 3; opacity: .7; }
.node.connect-src rect.box { stroke: var(--c-flag); stroke-width: 2.5; }
.node text { fill: var(--fg); font-family: var(--font-body); font-size: 12px; pointer-events: none; }
.node text.title { font-weight: 600; }
.node text.sub { fill: var(--fg-dim); font-size: 10.5px; }
.node text.startlbl { fill: var(--accent); font-family: var(--font-display); font-size: 14px; }
.node .warnmark { fill: var(--warn); }
.node .errmark { fill: var(--err); }
.edge path { fill: none; stroke: var(--fg-dim); stroke-width: 1.4; }
.edge.locked path { stroke-dasharray: 6 4; stroke: var(--c-flag); }
.edge.hidden path { stroke-dasharray: 2 4; }
.edge.broken path { stroke: var(--err); }
.edge text { fill: var(--fg-dim); font-size: 10px; font-family: var(--font-body); pointer-events: none; }
.edge text.glyph { font-size: 11px; fill: var(--c-flag); }
.edge.hidden text.glyph { fill: var(--fg-dim); }
.legend { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 11px; color: var(--fg-dim); display: flex; gap: 12px; flex-wrap: wrap; max-width: calc(100% - 20px); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 22px; border-top: 2px solid var(--fg-dim); }
.legend i.locked { border-top-style: dashed; border-color: var(--c-flag); }
.legend i.hidden { border-top-style: dotted; }
.legend i.unreach { width: 14px; height: 10px; border: 1px dashed var(--c-room); }
.popover { position: absolute; background: var(--panel); border: 1px solid var(--accent-dim); border-radius: 4px; padding: 10px; box-shadow: var(--shadow); z-index: 20; width: 240px; display: flex; flex-direction: column; gap: 8px; }
.popover .lbl { margin-bottom: 0; }
.maphint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--c-flag); color: var(--fg); border-radius: 4px; padding: 6px 12px; font-size: 12px; z-index: 10; }

/* Map decor, glyphs, handles */
.node .glyph { color: var(--c-room); }
.node.selected .glyph { color: var(--accent); }
.handle { fill: var(--accent); stroke: var(--bg); stroke-width: 1; cursor: nwse-resize; }
.handle.rotate { cursor: grab; }
.decor { color: var(--fg-dim); cursor: pointer; }
.decor:hover, .decor.selected { color: var(--fg); }
.decor .hit { fill: transparent; }
.decor use, .decor text { pointer-events: none; }
.decor text.decor-label { fill: currentColor; font-family: var(--font-display); font-size: 15px; letter-spacing: .4px; }
.decor .selbox { fill: none; stroke: var(--accent); stroke-dasharray: 4 3; }
.decor .rotline { stroke: var(--accent); }
.menu button .mi { width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px; color: var(--fg-dim); }
.menu.wide { columns: 2; min-width: 300px; }
.menu.wide button { break-inside: avoid; }

/* Tables (flags, problems) */
.table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th { text-align: left; font-family: var(--font-display); font-size: 17px; letter-spacing: .4px; color: var(--fg-dim); font-weight: normal; padding: 6px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.table td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--panel-2); }
.tablewrap { overflow: auto; flex: 1; min-height: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 3px; background: var(--panel-3); font-size: 11.5px; margin: 2px 3px 2px 0; border: 1px solid transparent; }
.chip.link { cursor: pointer; }
.chip.link:hover { border-color: var(--accent-dim); }
.chip .x { cursor: pointer; color: var(--fg-dim); padding: 0 2px; }
.chip .x:hover { color: var(--err); }
.problem { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: flex-start; }
.problem:hover { background: var(--panel-2); }
.problem .lvl { font-family: var(--font-display); font-size: 15px; width: 52px; flex: none; text-transform: uppercase; }
.problem .lvl.error { color: var(--err); } .problem .lvl.warn { color: var(--warn); } .problem .lvl.info { color: var(--c-room); }
.problem .msg { flex: 1; min-width: 0; }
.problem .who { color: var(--fg-dim); font-size: 11px; }
.allgood { padding: 40px 20px; text-align: center; color: var(--fg-dim); }
.allgood b { display: block; font-family: var(--font-display); font-size: 28px; color: var(--accent); font-weight: normal; }

/* JSON */
.jsonpane textarea { flex: 1; min-height: 0; width: 100%; border: none; border-radius: 0; background: var(--bg); color: var(--fg); padding: 12px; font-size: 12px; line-height: 1.5; resize: none; white-space: pre; overflow: auto; }
.jsonpane textarea:focus { box-shadow: none; }
.jsonbar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 12px; color: var(--fg-dim); }
.jsonbar .status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jsonbar .status.err { color: var(--err); }

/* Inspector */
.insp-body { padding: 12px 14px 40px; display: flex; flex-direction: column; gap: 14px; }
.insp-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.insp-title .kind { font-family: var(--font-display); font-size: 15px; letter-spacing: .6px; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--panel-3); }
.insp-title h2 { font-family: var(--font-display); font-size: 26px; font-weight: normal; margin: 0; line-height: 1; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-wrap: balance; }
.idline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); flex-wrap: wrap; }
.idline code { background: var(--bg); padding: 1px 6px; border-radius: 3px; color: var(--fg); border: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lbl { font-family: var(--font-display); font-size: 16px; letter-spacing: .5px; color: var(--fg-dim); text-transform: uppercase; line-height: 1; display: flex; gap: 6px; align-items: baseline; }
.lbl .req { color: var(--err); }
.lbl .key { font-family: var(--font-body); font-size: 10px; text-transform: none; letter-spacing: 0; opacity: .7; }
.hint { font-size: 11px; color: var(--fg-dim); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.block { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.block-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; user-select: none; }
.block-head .lbl { color: var(--fg); }
.block-head .sw { margin-left: auto; }
.block.off .block-body { display: none; }
.block.off .block-head .lbl { color: var(--fg-dim); }
.block-body { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.sw { position: relative; width: 30px; height: 16px; border-radius: 8px; background: var(--panel-3); border: 1px solid var(--line); flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--fg-dim); transition: left .12s; }
.sw.on { background: var(--accent-soft); border-color: var(--accent-dim); }
.sw.on::after { left: 16px; background: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel-2); }
.card-head { display: flex; align-items: center; gap: 8px; }
.card-head .ttl { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.compact .adv { display: none; }
.sec-title { font-family: var(--font-display); font-size: 21px; color: var(--accent); letter-spacing: .4px; line-height: 1; display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.sec-title .badge { font-family: var(--font-body); }
.sec-title .btn { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 0; }
.addrow { display: flex; gap: 6px; align-items: center; }
.addrow select { flex: 1; }
.tier { font-family: var(--font-display); font-size: 15px; letter-spacing: .5px; padding: 1px 7px; border-radius: 3px; border: 1px solid currentColor; }
.stat-preview { font-size: 11.5px; color: var(--fg-dim); background: var(--bg); border: 1px dashed var(--line); padding: 6px 8px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.stat-preview b { color: var(--fg); font-weight: 500; }
.where { font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.where .none { color: var(--warn); }
.insp-empty { padding: 40px 20px; color: var(--fg-dim); text-align: center; }
.insp-empty b { display: block; font-family: var(--font-display); font-size: 26px; color: var(--accent); font-weight: normal; margin-bottom: 6px; }
.insp-empty ul { text-align: left; display: inline-block; margin: 12px 0 0; padding-left: 18px; }
.insp-empty li { margin: 3px 0; }
.danger-zone { display: flex; gap: 6px; justify-content: flex-end; padding-top: 10px; border-top: 1px solid var(--line); }
.confirm { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--warn); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; }
.dl dt { color: var(--fg-dim); }
.dl dd { margin: 0; }

/* Status bar + bottom nav */
.statusbar { display: flex; gap: 14px; align-items: center; padding: 4px 16px; border-top: 1px solid var(--line); background: var(--panel); font-size: 11.5px; color: var(--fg-dim); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.statusbar .spacer { flex: 1; }
.bottomnav { display: none; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bottomnav button { flex: 1; font-family: var(--font-display); font-size: 19px; padding: 8px 4px; background: transparent; border: none; color: var(--fg-dim); cursor: pointer; }
.bottomnav button.active { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: var(--panel); color: var(--fg); border: 1px solid var(--accent-dim); padding: 8px 14px; border-radius: 4px; box-shadow: var(--shadow); z-index: 50; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .15s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.dropzone { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: none; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 34px; color: var(--accent); border: 3px dashed var(--accent); pointer-events: none; }
.dropzone.show { display: flex; }
.menu { position: absolute; top: 100%; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); z-index: 30; min-width: 220px; padding: 4px; display: none; }
.menu.open { display: block; }
.menu button { display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 6px 10px; cursor: pointer; color: var(--fg); border-radius: 3px; }
.menu button:hover { background: var(--panel-2); }
.menu button small { display: block; color: var(--fg-dim); font-size: 11px; }
.relwrap { position: relative; }
kbd { font-family: var(--font-body); font-size: 10.5px; background: var(--panel-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--fg-dim); }

@media (max-width: 1100px) { .main { grid-template-columns: 240px minmax(0,1fr) 360px; } }
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .sidebar, .center, .inspector { display: none; border: none; }
  .main[data-view="browse"] .sidebar { display: flex; }
  .main[data-view="canvas"] .center { display: flex; }
  .main[data-view="edit"] .inspector { display: flex; }
  .bottomnav { display: flex; }
  .statusbar { display: none; }
  .worldname { max-width: 50vw; }
  .grid3 { grid-template-columns: 1fr 1fr; }
  .brand { font-size: 22px; }
}

  </style>
</head>
<body>
  <div class="wb-host" id="builder"></div>
  <script type="application/json" id="wb-schema">{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://supertextadventure.com/contract/world.schema.json",
  "title": "Super Text Adventure world",
  "description": "The shape of a Classic Game Engine world document. Cross-references between ids are described separately in world.refs.json. Unknown keys are allowed everywhere except attack_condition, so worlds keep validating when new fields land.",
  "type": "object",
  "required": ["meta", "rooms"],
  "properties": {
    "meta": { "$ref": "#/$defs/meta" },
    "rooms": { "type": "object", "additionalProperties": { "$ref": "#/$defs/room" } },
    "items": { "type": "object", "additionalProperties": { "$ref": "#/$defs/item" } },
    "npcs": { "type": "object", "additionalProperties": { "$ref": "#/$defs/npc" } },
    "creatures": { "type": "object", "additionalProperties": { "$ref": "#/$defs/creature" } }
  },
  "$defs": {
    "id": { "type": "string", "minLength": 1 },
    "flag": { "type": "string", "minLength": 1 },
    "text": { "type": "string" },
    "idList": { "type": "array", "items": { "$ref": "#/$defs/id" } },
    "stringList": { "type": "array", "items": { "type": "string" } },

    "meta": {
      "type": "object",
      "required": ["name", "description", "starting_room"],
      "properties": {
        "name": { "type": "string", "minLength": 1 },
        "description": { "$ref": "#/$defs/text" },
        "starting_room": { "$ref": "#/$defs/id" },
        "version": { "type": "string" },
        "author": { "type": "string" },
        "editor": { "description": "Builder-only visual metadata (map positions, sizes, glyphs, decor). Never validated further and ignored by the engine." }
      }
    },

    "exit": {
      "oneOf": [
        { "$ref": "#/$defs/id" },
        { "$ref": "#/$defs/exitObject" }
      ]
    },
    "exitObject": {
      "type": "object",
      "required": ["to"],
      "properties": {
        "to": { "$ref": "#/$defs/id" },
        "keywords": { "$ref": "#/$defs/stringList" },
        "requires": { "$ref": "#/$defs/id" },
        "requires_flag": { "$ref": "#/$defs/flag" },
        "locked_msg": { "$ref": "#/$defs/text" },
        "unlocked_msg": { "$ref": "#/$defs/text" },
        "use_item": { "$ref": "#/$defs/id" },
        "on_unlock": { "$ref": "#/$defs/text" },
        "permanently_unlock": { "type": "boolean", "default": false },
        "consume_item": { "type": "boolean", "default": false },
        "sets_flag": { "$ref": "#/$defs/flag" },
        "hidden": { "type": "boolean", "default": false },
        "reveal_msg": { "$ref": "#/$defs/text" }
      }
    },

    "room": {
      "type": "object",
      "required": ["name", "description"],
      "properties": {
        "name": { "type": "string", "minLength": 1 },
        "description": { "$ref": "#/$defs/text" },
        "exits": { "type": "object", "additionalProperties": { "$ref": "#/$defs/exit" } },
        "items": { "$ref": "#/$defs/idList" },
        "npcs": { "$ref": "#/$defs/idList" },
        "creatures": { "$ref": "#/$defs/idList" },
        "on_enter": {
          "type": "object",
          "required": ["type", "text"],
          "properties": {
            "type": { "const": "message" },
            "text": { "$ref": "#/$defs/text" }
          }
        }
      }
    },

    "diceOutcome": {
      "type": "object",
      "properties": {
        "message": { "$ref": "#/$defs/text" },
        "sets_flag": { "$ref": "#/$defs/flag" },
        "unlocks_exit": {
          "type": "object",
          "required": ["direction"],
          "properties": {
            "direction": { "type": "string", "minLength": 1 },
            "room": { "$ref": "#/$defs/id" }
          }
        },
        "unlocks_dialogue": {
          "type": "object",
          "required": ["topic"],
          "properties": { "topic": { "type": "string", "minLength": 1 } }
        }
      }
    },
    "diceRoll": {
      "type": "object",
      "required": ["dc", "on_success", "on_failure"],
      "properties": {
        "dc": { "type": "integer", "minimum": 1 },
        "dice": { "type": "string", "pattern": "^[0-9]+d[0-9]+$", "default": "1d20" },
        "attempt_message": { "$ref": "#/$defs/text" },
        "completed_message": { "$ref": "#/$defs/text" },
        "consume_on": { "enum": ["failure", "success", "any"] },
        "on_success": { "$ref": "#/$defs/diceOutcome" },
        "on_failure": { "$ref": "#/$defs/diceOutcome" }
      }
    },

    "item": {
      "type": "object",
      "required": ["name", "description"],
      "properties": {
        "name": { "type": "string", "minLength": 1 },
        "description": { "$ref": "#/$defs/text" },
        "keywords": { "$ref": "#/$defs/stringList" },
        "takeable": { "type": "boolean", "default": true },
        "cant_take_msg": { "$ref": "#/$defs/text" },
        "consumable": { "type": "boolean", "default": false },
        "weapon_damage": { "type": "number", "minimum": 0 },
        "defense_bonus": { "type": "number", "minimum": 0 },
        "combat_effect": {
          "type": "object",
          "required": ["type"],
          "properties": {
            "type": { "const": "heal" },
            "amount": { "type": "number", "minimum": 1, "default": 10 }
          }
        },
        "on_use": {
          "type": "object",
          "required": ["type"],
          "properties": {
            "type": { "enum": ["unlock", "message", "heal"] },
            "requires_target": { "type": "boolean", "default": false },
            "sets_flag": { "$ref": "#/$defs/flag" },
            "success_msg": { "$ref": "#/$defs/text" },
            "text": { "$ref": "#/$defs/text" },
            "amount": { "type": "number", "minimum": 1 }
          }
        },
        "reveals_exit": {
          "type": "object",
          "required": ["direction"],
          "properties": {
            "direction": { "type": "string", "minLength": 1 },
            "message": { "$ref": "#/$defs/text" }
          }
        },
        "on_examine": {
          "type": "object",
          "properties": {
            "reveals_exit": { "type": "string", "minLength": 1 },
            "text": { "$ref": "#/$defs/text" }
          }
        },
        "dice_roll": { "$ref": "#/$defs/diceRoll" },
        "is_container": { "type": "boolean", "default": false },
        "starts_closed": { "type": "boolean", "default": true },
        "locked": { "type": "boolean", "default": false },
        "unlock_item": { "$ref": "#/$defs/id" },
        "unlock_flag": { "$ref": "#/$defs/flag" },
        "locked_message": { "$ref": "#/$defs/text" },
        "on_open_message": { "$ref": "#/$defs/text" },
        "on_close_message": { "$ref": "#/$defs/text" },
        "open_description": { "$ref": "#/$defs/text" },
        "closed_description": { "$ref": "#/$defs/text" },
        "empty_message": { "$ref": "#/$defs/text" },
        "contents": { "$ref": "#/$defs/idList" }
      }
    },

    "topic": {
      "type": "object",
      "properties": {
        "keywords": { "$ref": "#/$defs/stringList" },
        "text": { "$ref": "#/$defs/text" },
        "sets_flag": { "$ref": "#/$defs/flag" },
        "requires_flag": { "$ref": "#/$defs/flag" },
        "requires_item": { "$ref": "#/$defs/id" },
        "locked_text": { "$ref": "#/$defs/text" },
        "leads_to": { "$ref": "#/$defs/stringList" }
      }
    },
    "dialogue": {
      "type": "object",
      "properties": {
        "greeting": { "$ref": "#/$defs/text" },
        "default": { "$ref": "#/$defs/text" },
        "sets_flag": { "$ref": "#/$defs/flag" },
        "topics": { "type": "object", "additionalProperties": { "$ref": "#/$defs/topic" } }
      }
    },

    "movement": {
      "oneOf": [
        { "$ref": "#/$defs/patrolMovement" },
        { "$ref": "#/$defs/triggeredMovement" }
      ]
    },
    "patrolMovement": {
      "type": "object",
      "required": ["type", "schedule"],
      "properties": {
        "type": { "const": "patrol" },
        "schedule": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "required": ["room"],
            "properties": {
              "room": { "$ref": "#/$defs/id" },
              "duration": { "type": "integer", "minimum": 1 },
              "blocked_while_player_in": { "$ref": "#/$defs/idList" }
            }
          }
        },
        "depart_msg": { "$ref": "#/$defs/text" },
        "arrive_msg": { "$ref": "#/$defs/text" }
      }
    },
    "triggeredMovement": {
      "type": "object",
      "required": ["type", "trigger_flag", "destination"],
      "properties": {
        "type": { "const": "triggered" },
        "trigger_flag": { "$ref": "#/$defs/flag" },
        "destination": { "$ref": "#/$defs/id" },
        "depart_msg": { "$ref": "#/$defs/text" },
        "arrive_msg": { "$ref": "#/$defs/text" }
      }
    },

    "npc": {
      "type": "object",
      "required": ["name", "description"],
      "properties": {
        "name": { "type": "string", "minLength": 1 },
        "description": { "$ref": "#/$defs/text" },
        "keywords": { "$ref": "#/$defs/stringList" },
        "dialogue": { "$ref": "#/$defs/dialogue" },
        "movement": { "$ref": "#/$defs/movement" },
        "accepts_item": { "$ref": "#/$defs/id" },
        "gives_item": { "$ref": "#/$defs/id" },
        "accept_message": { "$ref": "#/$defs/text" },
        "sets_flag": { "$ref": "#/$defs/flag" }
      }
    },

    "creature": {
      "type": "object",
      "required": ["name", "description", "health"],
      "properties": {
        "name": { "type": "string", "minLength": 1 },
        "description": { "$ref": "#/$defs/text" },
        "keywords": { "$ref": "#/$defs/stringList" },
        "health": { "type": "number", "exclusiveMinimum": 0 },
        "attack": { "type": "number", "minimum": 0, "default": 5 },
        "defense": { "type": "number", "minimum": 0, "default": 0 },
        "hostile": { "type": "boolean", "default": false },
        "talk_text": { "$ref": "#/$defs/text" },
        "aggro_text": { "$ref": "#/$defs/text" },
        "attack_condition": {
          "type": "object",
          "description": "Exactly one of moves, room_entries, on_talk. The engine evaluates only one key, and an unknown key makes the creature never attack.",
          "minProperties": 1,
          "maxProperties": 1,
          "properties": {
            "moves": { "type": "integer", "minimum": 1 },
            "room_entries": { "type": "integer", "minimum": 1 },
            "on_talk": { "type": "boolean" }
          },
          "additionalProperties": false
        },
        "movement": { "$ref": "#/$defs/movement" },
        "on_defeat_msg": { "$ref": "#/$defs/text" },
        "on_flee_msg": { "$ref": "#/$defs/text" },
        "loot": { "$ref": "#/$defs/idList" },
        "sets_flag_on_defeat": { "$ref": "#/$defs/flag" }
      }
    }
  },
  "x-engine-defaults": {
    "player_max_health": 10,
    "player_base_attack": 5,
    "attack_variance": 2,
    "defend_bonus": 3,
    "flee_chance": 0.5
  }
}
</script>
  <script type="application/json" id="wb-refs">{
  "description": "Every place a world document refers to an id defined elsewhere. Paths are dotted; * matches any key of an object or any index of an array. kind names the top-level collection the value must exist in (rooms, items, npcs, creatures), or flag for global flags (which need no definition), or topic for dialogue topic keys. mode is advice for tooling: place means the entity starts there or is obtainable there; set and check say what a flag reference does. when: string restricts a rule to string values, for exits that can be either a room id or an object.",
  "refs": [
    { "path": "meta.starting_room", "kind": "rooms" },

    { "path": "rooms.*.exits.*", "kind": "rooms", "when": "string" },
    { "path": "rooms.*.exits.*.to", "kind": "rooms" },
    { "path": "rooms.*.exits.*.requires", "kind": "items" },
    { "path": "rooms.*.exits.*.use_item", "kind": "items" },
    { "path": "rooms.*.exits.*.requires_flag", "kind": "flag", "mode": "check" },
    { "path": "rooms.*.exits.*.sets_flag", "kind": "flag", "mode": "set" },
    { "path": "rooms.*.items.*", "kind": "items", "mode": "place" },
    { "path": "rooms.*.npcs.*", "kind": "npcs", "mode": "place" },
    { "path": "rooms.*.creatures.*", "kind": "creatures", "mode": "place" },

    { "path": "items.*.on_use.sets_flag", "kind": "flag", "mode": "set" },
    { "path": "items.*.dice_roll.on_success.sets_flag", "kind": "flag", "mode": "set" },
    { "path": "items.*.dice_roll.on_failure.sets_flag", "kind": "flag", "mode": "set" },
    { "path": "items.*.dice_roll.on_success.unlocks_exit.room", "kind": "rooms" },
    { "path": "items.*.dice_roll.on_failure.unlocks_exit.room", "kind": "rooms" },
    { "path": "items.*.dice_roll.on_success.unlocks_dialogue.topic", "kind": "topic", "scope": "world" },
    { "path": "items.*.dice_roll.on_failure.unlocks_dialogue.topic", "kind": "topic", "scope": "world" },
    { "path": "items.*.unlock_item", "kind": "items" },
    { "path": "items.*.unlock_flag", "kind": "flag", "mode": "check" },
    { "path": "items.*.contents.*", "kind": "items", "mode": "place" },

    { "path": "npcs.*.dialogue.sets_flag", "kind": "flag", "mode": "set" },
    { "path": "npcs.*.dialogue.topics.*.sets_flag", "kind": "flag", "mode": "set" },
    { "path": "npcs.*.dialogue.topics.*.requires_flag", "kind": "flag", "mode": "check" },
    { "path": "npcs.*.dialogue.topics.*.requires_item", "kind": "items" },
    { "path": "npcs.*.dialogue.topics.*.leads_to.*", "kind": "topic", "scope": "npc" },
    { "path": "npcs.*.accepts_item", "kind": "items" },
    { "path": "npcs.*.gives_item", "kind": "items", "mode": "place" },
    { "path": "npcs.*.sets_flag", "kind": "flag", "mode": "set" },
    { "path": "npcs.*.movement.schedule.*.room", "kind": "rooms" },
    { "path": "npcs.*.movement.schedule.*.blocked_while_player_in.*", "kind": "rooms" },
    { "path": "npcs.*.movement.trigger_flag", "kind": "flag", "mode": "check" },
    { "path": "npcs.*.movement.destination", "kind": "rooms" },

    { "path": "creatures.*.loot.*", "kind": "items", "mode": "place" },
    { "path": "creatures.*.sets_flag_on_defeat", "kind": "flag", "mode": "set" },
    { "path": "creatures.*.movement.schedule.*.room", "kind": "rooms" },
    { "path": "creatures.*.movement.schedule.*.blocked_while_player_in.*", "kind": "rooms" },
    { "path": "creatures.*.movement.trigger_flag", "kind": "flag", "mode": "check" },
    { "path": "creatures.*.movement.destination", "kind": "rooms" }
  ]
}
</script>
  <script type="application/json" id="wb-samples">[{"key":"the_crystal_quest","name":"The Crystal Quest","description":"Retrieve the Crystal of Power from the forest cave and return it to the wizard.","world":{"meta":{"name":"The Crystal Quest","description":"Retrieve the Crystal of Power from the forest cave and return it to the wizard.","starting_room":"tavern","version":"1.0"},"rooms":{"tavern":{"name":"The Rusty Flagon","description":"A cozy tavern with a crackling fireplace. The bartender polishes glasses behind the bar. A wooden chest sits in the corner.","exits":{"north":"forest_edge"},"on_enter":{"type":"message","text":"The warmth of the fire embraces you. A wizard in the corner catches your eye."},"items":["rusty_sword","tavern_chest","old_map"],"npcs":["wizard"],"creatures":[]},"forest_edge":{"name":"Forest Edge","description":"Tall trees loom before you. A narrow path winds into the dark woods. You can hear something skittering in the undergrowth.","exits":{"south":"tavern","north":"deep_forest"},"items":["rusty_key"],"npcs":[],"creatures":[]},"deep_forest":{"name":"Deep Forest","description":"The canopy blocks out most of the light. Thick webs hang between the trees. An iron gate blocks the path further north.","exits":{"south":"forest_edge","north":{"to":"crystal_cave","keywords":["gate","iron gate"],"use_item":"rusty_key","on_unlock":"The rusty key turns in the lock with a grinding screech. The gate swings open.","permanently_unlock":true,"consume_item":true,"locked_msg":"An iron gate blocks the way. It's locked.","sets_flag":"gate_opened"}},"items":[],"npcs":[],"creatures":["giant_spider"]},"crystal_cave":{"name":"Crystal Cave","description":"The cave glows with an ethereal blue light. In the center stands a stone pedestal, worn smooth by ages of reverent hands.","exits":{"south":"deep_forest"},"on_enter":{"type":"message","text":"The air hums with magical energy. You feel the crystal calling to you."},"items":["power_crystal"],"npcs":[],"creatures":[]}},"items":{"rusty_sword":{"name":"Rusty Sword","description":"A dull but serviceable blade. Better than nothing.","keywords":["sword","blade"],"weapon_damage":5},"health_potion":{"name":"Health Potion","description":"A small vial of glowing red liquid.","keywords":["potion","vial"],"consumable":true,"combat_effect":{"type":"heal","amount":15}},"rusty_key":{"name":"Rusty Key","description":"An old iron key covered in rust. It might fit the gate in the forest.","keywords":["key","iron key"]},"power_crystal":{"name":"Crystal of Power","description":"A brilliant blue crystal that pulses with magical energy.","keywords":["crystal","blue crystal"]},"spider_silk":{"name":"Spider Silk","description":"A bundle of incredibly strong silk from the giant spider.","keywords":["silk","web"],"defense_bonus":2},"spell_book":{"name":"Spell Book","description":"A leather-bound tome filled with arcane knowledge.","keywords":["book","tome"]},"tavern_chest":{"name":"Wooden Chest","description":"A small wooden chest tucked in the corner.","keywords":["chest","box"],"is_container":true,"takeable":false,"locked":false,"on_open_message":"The chest lid creaks open.","contents":["health_potion","lockpick"]},"old_map":{"name":"Faded Map","description":"A map showing the forest paths. There's an X marked at a cave.","keywords":["map"],"takeable":false,"on_examine":{"text":"Studying the map carefully, you notice a hidden trail marked with small runes."}},"lockpick":{"name":"Lockpick","description":"A thin metal pick for opening locks.","keywords":["pick"],"consumable":true,"dice_roll":{"dc":12,"dice":"1d20","attempt_message":"You carefully insert the lockpick...","consume_on":"failure","on_success":{"message":"Click! The lock opens.","sets_flag":"lock_picked"},"on_failure":{"message":"The pick snaps! You'll need another."}}}},"npcs":{"wizard":{"name":"Old Wizard","description":"An elderly wizard in blue robes. His beard nearly touches the floor.","keywords":["wizard","old man","mage"],"dialogue":{"greeting":"Ah, a brave soul! I've been waiting for someone like you. Ask me about the quest.","default":"Hmm, I know nothing of that.","sets_flag":"met_wizard","topics":{"quest":{"keywords":["quest","mission","adventure"],"text":"Deep in the forest lies a Crystal of Power. Retrieve it and bring it to me. Take the key by the forest edge, you'll need it for the gate.","sets_flag":"quest_started","leads_to":["crystal","danger"]},"crystal":{"keywords":["crystal","power"],"text":"The Crystal of Power is an ancient artifact. It must not fall into the wrong hands.","locked_text":"Ask me about the quest first."},"danger":{"keywords":["danger","warning","monster"],"text":"Beware the giant spider that guards the forest path. It won't let you pass easily.","locked_text":"There's nothing to warn you about yet."}}},"accepts_item":"power_crystal","gives_item":"spell_book","accept_message":"The wizard's eyes widen. 'You found it! The Crystal of Power! As promised, take this spell book. You've earned it, adventurer.'","sets_flag":"quest_complete"}},"creatures":{"giant_spider":{"name":"Giant Spider","description":"A spider the size of a large dog. Its fangs drip with venom.","keywords":["spider"],"health":12,"attack":3,"defense":1,"hostile":true,"attack_condition":{"moves":3},"aggro_text":"The Giant Spider lunges at you!","on_defeat_msg":"The spider collapses, its legs curling inward. A bundle of silk falls from its web.","on_flee_msg":"You scramble away from the spider's reach!","loot":["spider_silk"],"sets_flag_on_defeat":"spider_defeated"}}}},{"key":"the_tipsy_dragon","name":"The Tipsy Dragon","description":"A humorous introductory adventure. You wake up in a tavern cellar with no memory of last n","world":{"meta":{"name":"The Tipsy Dragon","starting_room":"cellar","version":"1.0","author":"SuperTextAdventure","description":"A humorous introductory adventure. You wake up in a tavern cellar with no memory of last night and an enormous tab to settle."},"rooms":{"cellar":{"name":"The Tavern Cellar","description":"You wake up on a pile of empty grain sacks. Your head is pounding and you have absolutely no memory of how you got here. The cellar is damp and smells of old ale and regret. A rickety staircase leads up to the tavern floor. A rat watches you from atop a barrel with what appears to be pity.","exits":{"up":"tavern_floor"},"items":["sticky_mug","crumpled_receipt"],"npcs":[],"creatures":["judgmental_rat"],"on_enter":{"type":"message","text":"Your head throbs. Somewhere above, you hear the clinking of mugs and a voice bellowing about an unpaid tab."}},"tavern_floor":{"name":"The Tipsy Dragon Tavern","description":"The tavern is surprisingly cozy despite the sticky floors and questionable stains on the ceiling. A roaring fire crackles in the hearth. The barkeep stands behind the counter, polishing a mug with a rag that somehow makes the mug dirtier. A door leads outside to the village square. The cellar stairs descend back down.","exits":{"down":"cellar","south":"village_square"},"items":["tavern_menu"],"npcs":["barkeep","wandering_bard"]},"village_square":{"name":"Village Square","description":"A modest village square with a cracked fountain that hasn't seen water since the last king's coronation. A notice board stands beside it, covered in overlapping parchments. The tavern door is to the north. A forest path winds eastward, and a rickety bridge crosses a ravine to the west.","exits":{"north":"tavern_floor","east":"forest_path","west":"bridge"},"items":["notice_board"],"npcs":["confused_wizard"]},"forest_path":{"name":"The Whispering Woods Path","description":"Tall oaks arch overhead, their leaves rustling with what sounds suspiciously like gossip. The path is well-worn but littered with an unusual number of chicken feathers. A small clearing opens to the north, and the village square lies back to the west.","exits":{"west":"village_square","north":"chicken_clearing"},"items":[],"npcs":[],"creatures":["dust_bunny"]},"chicken_clearing":{"name":"The Dreaded Clearing","description":"A sun-dappled clearing ringed by ancient stones. In the center stands what appears to be a small throne made of twigs and feathers. The surrounding area is littered with the bones of... acorns? The forest path leads south.","exits":{"south":"forest_path"},"items":["golden_acorn"],"npcs":[],"creatures":["el_pollo_terrible"]},"bridge":{"name":"The Rickety Bridge","description":"A bridge made of rope and questionable optimism stretches across a deep ravine. The planks creak ominously with every step. A large figure sits in the middle, blocking passage. The village square lies to the east.","exits":{"east":"village_square","west":{"to":"hermit_cave","requires_flag":"troll_satisfied","locked_msg":"The troll blocks your path and wags a philosophical finger at you. 'None shall pass without first engaging in meaningful discourse!'"}},"items":[],"npcs":["philosophical_troll"]},"hermit_cave":{"name":"The Hermit's Cave","description":"A surprisingly well-furnished cave with bookshelves carved into the rock walls, a plush armchair, and a small fire. Someone has been living here quite comfortably. A glittering chest sits in the corner. The bridge lies back to the east.","exits":{"east":"bridge"},"items":["treasure_chest"],"npcs":[]}},"items":{"sticky_mug":{"name":"Suspiciously Sticky Mug","description":"A tavern mug so sticky it briefly adheres to everything it touches. Whatever was in here last night, it was not entirely liquid. The bottom is engraved with the words 'Property of The Tipsy Dragon - STEAL THIS AND BE CURSED.'","keywords":["mug","sticky mug","cup"],"takeable":true},"crumpled_receipt":{"name":"Crumpled Receipt","description":"A crumpled piece of parchment. You flatten it out to read: 'TAB FOR THE EVENING: 47 ales, 12 meat pies, 1 whole roast boar (WHY?), 3 bardic performances (unsolicited). TOTAL: 1,000 GOLD PIECES. Payment due: IMMEDIATELY.' At the bottom, someone has drawn a frowny face.","keywords":["receipt","parchment","note","tab","bill"],"takeable":true},"tavern_menu":{"name":"Tavern Menu","description":"A chalkboard menu listing today's specials: 'Mystery Stew (don't ask)', 'Bread (probably)', 'Ale (definitely)', and 'The House Special (we ran out years ago but keep it on the menu for sentimental reasons).'","keywords":["menu","chalkboard","board"],"takeable":false,"cant_take_msg":"The menu is nailed to the wall. Probably to stop people from using it as a shield."},"notice_board":{"name":"Village Notice Board","description":"A weathered notice board. Most postings are mundane ('Lost cat - answers to Lord Fluffington III'), but one stands out: 'WANTED: Brave adventurer to retrieve the Golden Acorn from the Dreaded Clearing. REWARD: Enough gold to pay off even the most irresponsible tavern tab. Ask the wizard in the square for details.'","keywords":["notice board","board","notices","posting"],"takeable":false,"cant_take_msg":"You cannot take the notice board. It is a pillar of the community."},"golden_acorn":{"name":"Golden Acorn","description":"A magnificent acorn made of solid gold. It's surprisingly heavy for something so small. It radiates a warm, faintly nutty glow. This is clearly the treasure mentioned on the notice board.","keywords":["acorn","golden acorn","gold acorn","treasure"],"takeable":true},"wizard_hat":{"name":"Slightly Singed Wizard Hat","description":"A tall, pointy hat with scorch marks and what appears to be a small bird's nest in the brim. Despite its condition, it tingles with residual magic. Or maybe static electricity.","keywords":["hat","wizard hat"],"takeable":true,"defense_bonus":1},"rusty_pan":{"name":"Rusty Frying Pan","description":"A cast-iron frying pan with a loose handle. It has clearly seen better days and better breakfasts. It could serve as a makeshift weapon in a pinch.","keywords":["pan","frying pan","skillet"],"takeable":true,"weapon_damage":3},"treasure_chest":{"name":"Glittering Chest","description":"An ornate chest with gold filigree and a suspiciously easy-to-open latch. A small tag reads: 'Congratulations! You found it!'","keywords":["chest","treasure chest","glittering chest"],"takeable":false,"cant_take_msg":"The chest is bolted to the cave floor. Someone really thought this through.","is_container":true,"starts_closed":true,"contents":["gold_pouch"]},"gold_pouch":{"name":"Bulging Gold Pouch","description":"A heavy leather pouch containing exactly 1,000 gold pieces. What are the odds? A note inside reads: 'For services rendered to the Clearing. Spend wisely. (You won't.)'","keywords":["pouch","gold","gold pouch","money","coins"],"takeable":true},"healing_herb":{"name":"Suspicious Healing Herb","description":"A scraggly green plant that the wizard swears has healing properties. It smells like mint mixed with old socks.","keywords":["herb","healing herb","plant"],"takeable":true,"consumable":true,"combat_effect":{"type":"heal","amount":15}}},"npcs":{"barkeep":{"name":"Greta the Barkeep","description":"A formidable woman with arms like tree trunks and a glare that could curdle milk at twenty paces. She is polishing the same mug she's been polishing since you arrived. It is not getting cleaner.","keywords":["barkeep","greta","bartender","innkeeper"],"dialogue":{"default":"Greta looks you up and down. 'Oh, you're ALIVE. Good. That means you can PAY. One thousand gold pieces. Don't look at me like that - you ordered a whole boar. A WHOLE BOAR. Who does that?' She gestures vaguely toward the village square. 'The wizard outside might know where to find some coin. Now stop dripping on my floor.'","topics":{"tab":{"keywords":["tab","bill","debt","money","pay","receipt"],"text":"One. Thousand. Gold. Pieces.' Greta enunciates each word like she's hammering nails. 'You also tried to tip the bard with a live chicken. We had to chase it for an hour."},"wizard":{"keywords":["wizard","wizbert","mage"],"text":"That old fool? He's been standing in the square all morning muttering about acorns. Harmless enough, I suppose. Just don't let him cast anything near the tavern. Last time he set the thatch on fire."},"boar":{"keywords":["boar","pig","swine","food"],"text":"You stood on a table, pointed at the kitchen, and yelled - and I quote - BRING ME YOUR FINEST SWINE. Then you ate the whole thing. With your hands. The bard wrote a song about it. It was not flattering."}}},"accepts_item":"gold_pouch","gives_item":"rusty_pan","accept_message":"Greta snatches the gold pouch and counts every single coin while you stand there awkwardly. '...nine hundred ninety-eight, nine hundred ninety-nine, one thousand. Right then.' Her expression softens almost imperceptibly. 'Debt's paid. And here - ' she slides a battered frying pan across the counter ' - a souvenir. You used it as a pillow last night. Figured you'd grown attached.' She almost smiles. Almost. 'Now get out of my tavern. Or stay and order something. Just... no more boars.'","sets_flag":"debt_paid"},"confused_wizard":{"name":"Wizbert the Occasionally Accurate","description":"An elderly wizard in stained robes who keeps adjusting a hat that isn't on his head. His beard has what appear to be breadcrumbs in it. He's muttering something about acorns and destiny.","keywords":["wizard","wizbert","old man","mage"],"dialogue":{"default":"'Ah! An adventurer! I can tell by the look of bewildered desperation. You seek GOLD, yes? The Golden Acorn! It lies in the Dreaded Clearing, east through the Whispering Woods. Guarded by a fearsome beast!' He pauses dramatically. 'A chicken. But a VERY fearsome chicken. I lost my hat to that chicken.' He stares into the middle distance. 'I miss that hat.'","topics":{"acorn":{"keywords":["acorn","golden acorn","treasure","gold"],"text":"The Golden Acorn! A treasure of immense value! Worth exactly one thousand gold pieces, coincidentally. It sits in the Dreaded Clearing to the east. Just follow the feathers. You'll know you're close when you hear the clucking. The terrible, terrible clucking."},"chicken":{"keywords":["chicken","pollo","el pollo","bird","hen"],"text":"El Pollo Terrible! The Scourge of the Clearing! It - it took my hat right off my head. Just... WHOOSH. Gone. The clearing is through the forest path, east of here. Be warned: it fights dirty. Mostly pecking. So much pecking."},"hat":{"keywords":["hat","wizard hat"],"text":"The wizard's eyes go misty. 'It was a good hat. Pointy. Traditional. Had a small bird living in it, which in retrospect may have attracted the chicken in the first place. If you happen to find it... no, no. The hat is gone. I must accept this.' He does not look like he has accepted this."},"troll":{"keywords":["troll","thinksworth","bridge"],"text":"Ah, old Thinksworth! Lovely fellow, really. Lives under the bridge to the west. Won't let anyone pass unless they engage in philosophical debate. Last fellow who tried just said YOLO and the troll sat on him."}}},"accepts_item":"golden_acorn","gives_item":"healing_herb","accept_message":"'THE ACORN! You found it! You brave, foolish, wonderful person!' Wizbert does a little jig that makes several concerning popping sounds. 'Here, take this healing herb. You look like you need it. The hermit's cave across the bridge has the gold reward - just get past old Thinksworth first. Try agreeing with him. He likes that.'","sets_flag":"wizard_helped"},"philosophical_troll":{"name":"Thinksworth the Bridge Troll","description":"An enormous troll wearing tiny spectacles perched on his massive nose. He's sitting cross-legged on the bridge reading a book titled 'Being and Nothingness (For Trolls).' He looks up at your approach with an expression of mild intellectual curiosity.","keywords":["troll","thinksworth","bridge troll"],"dialogue":{"default":"'Ah, a traveler! Before you cross, tell me: if a troll sits on a bridge and no one is around to cross it, is he still a bridge troll? Or just a troll who happens to be on a bridge?' He adjusts his spectacles. 'Take your time. I have literally nowhere to be.'","topics":{"bridge":{"keywords":["bridge"],"text":"This bridge? It's a metaphor. Also a bridge. It connects where you are to where you want to be. Much like all bridges, really. Also it's quite wobbly, so watch your step."},"philosophy":{"keywords":["philosophy","philosophical","think","thinking"],"text":"Philosophy is the pursuit of wisdom through questioning everything. For example: WHY do I sit on this bridge? WHAT is a bridge, really? And WHO keeps leaving chicken feathers everywhere?' He sighs contentedly. 'Beautiful questions, all."},"meaning of life":{"keywords":["meaning","life","meaning of life","purpose"],"text":"NOW we're talking! The meaning of life is...' He leans in conspiratorially. '...to ask what the meaning of life is. It's meanings all the way down.' He seems enormously pleased with himself. 'You know what? I like you. You may pass.' He scoots aside on the bridge.","sets_flag":"troll_satisfied"},"cave":{"keywords":["cave","hermit","gold"],"text":"The hermit's cave? Oh, the hermit left ages ago. Said something about finding himself. Left all his stuff though. Including, I believe, a rather substantial quantity of gold. Funny how finding yourself requires leaving your gold behind."}}},"accepts_item":"sticky_mug","gives_item":"wizard_hat","accept_message":"'A gift? For ME?' Thinksworth examines the sticky mug with delight. 'It's... it's the stickiest mug I've ever seen. This raises so many questions. What MADE it this sticky? Is stickiness an inherent property or an acquired one?' A tear rolls down his massive cheek. 'This is the most thoughtful thing anyone has ever given me. Here, take this hat I found - some wizard lost it ages ago. And please, cross freely!' He tucks the mug into his waistcoat pocket, beaming.","sets_flag":"troll_satisfied"},"wandering_bard":{"name":"Bardric the Unasked-For","description":"A reedy man clutching a lute he is not qualified to hold, let alone play. He strikes a chord so flat it visibly offends a nearby candle.","keywords":["bard","bardric","musician","minstrel"],"dialogue":{"default":"'AH! A PATRON!' Bardric strums dramatically. 'Allow me to regale you with THE BALLAD OF THE BOAR EATER - a stirring tale of one hero's magnificent gluttony, based on real events from LAST NIGHT!' You consider asking him to stop. You decide against it. He would only sing louder.","topics":{"song":{"keywords":["song","ballad","music","sing","play"],"text":"'It's thirty-seven verses long. I composed it this morning. I'm still workshopping the part where the hero weeps into a bowl of stew.' He strums mournfully. 'Art takes TIME."},"chicken":{"keywords":["chicken","pollo","tip","bird"],"text":"'Ah yes - the CHICKEN INCIDENT.' Bardric looks wounded. 'You tried to tip me with a LIVE CHICKEN. I do not accept poultry as payment. It took hours to catch. The chicken, I mean. Though also the tip."},"boar":{"keywords":["boar","ballad","pig","swine"],"text":"'THE BALLAD OF THE BOAR EATER will be my magnum opus. Verse twelve is just the word BOAR repeated twenty-six times, each with a different emotional inflection. It's very avant-garde."}}},"movement":{"type":"patrol","schedule":[{"room":"tavern_floor","duration":3},{"room":"village_square","duration":3}],"depart_msg":"Bardric slings his lute over his shoulder and wanders off, still humming to himself.","arrive_msg":"Bardric strolls in, already mid-song. Something about a boar, by the sound of it."}}},"creatures":{"judgmental_rat":{"name":"Judgmental Rat","description":"A plump rat sitting on a barrel, observing you with an expression that can only be described as disappointed. It shakes its tiny head slowly.","keywords":["rat","rodent"],"health":5,"attack":1,"defense":0,"hostile":false,"loot":[],"on_defeat_msg":"The rat squeaks in outrage and scurries away, but not before giving you one last withering look. You feel slightly worse about yourself.","on_flee_msg":"The rat watches you leave with an air of 'I expected nothing and I'm still disappointed.'"},"dust_bunny":{"name":"Terrifying Dust Bunny","description":"A creature made entirely of dust, cobwebs, and lost hope. It rolls toward you menacingly, leaving a trail of mild allergens. Despite its fearsome name, it's about the size of a cabbage.","keywords":["dust bunny","bunny","dust"],"health":10,"attack":2,"defense":0,"hostile":true,"loot":["healing_herb"],"on_defeat_msg":"The dust bunny explodes in a puff of dust and existential malaise. You sneeze twice. Through the settling dust, you spot something it was guarding.","on_flee_msg":"The dust bunny rolls after you a few feet, then gives up. Its attention span is as short as its legs (it has no legs)."},"el_pollo_terrible":{"name":"El Pollo Terrible","description":"A chicken of unusual size and temperament. Its feathers are puffed out to maximum intimidation volume, its eyes burn with an ancient fury, and it's wearing what appears to be a wizard's hat as a trophy. It clucks menacingly.","keywords":["chicken","pollo","el pollo","hen","bird"],"health":25,"attack":6,"defense":2,"hostile":true,"loot":["wizard_hat"],"on_defeat_msg":"El Pollo Terrible lets out one final dramatic BAWK, drops the wizard's hat, and struts away with wounded dignity. It's not defeated - it's simply choosing to leave. There's a difference, and the chicken wants you to know that.","on_flee_msg":"El Pollo Terrible clucks triumphantly as you retreat, then resumes sitting on its twig throne like the tiny tyrant it is."}}}},{"key":"blank","name":"Blank world","description":"One starting room and nothing else","world":{"meta":{"name":"Untitled Adventure","description":"A brand new world.","starting_room":"start","version":"1.0"},"rooms":{"start":{"name":"Starting Room","description":"You are standing in an empty room. It is waiting for you to describe it.","exits":{},"items":[],"npcs":[],"creatures":[]}},"items":{},"npcs":{},"creatures":{}}}]</script>
  <script>
(function () {
// The world contract, evaluated in the browser.
//
// Consumes the same two data files the Ruby validator uses
// (app/lib/classic_game/contract/world.schema.json and world.refs.json) and
// produces the same error codes, so the builder and the engine never disagree
// about what a valid world is. The fixture corpus under
// test/fixtures/files/worlds proves the two implementations agree.

const COLLECTIONS = ["rooms", "items", "npcs", "creatures"];
const SINGULAR = { rooms: "room", items: "item", npcs: "NPC", creatures: "creature" };
const CONSUME_ON = ["failure", "success", "any"];

const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);

// ---------- JSON Schema (the subset the contract uses) ----------

function typeOf(v) {
  if (v === null) return "null";
  if (Array.isArray(v)) return "array";
  return typeof v;
}
function matchesType(v, t) {
  if (t === "integer") return typeof v === "number" && Number.isInteger(v);
  if (t === "number") return typeof v === "number";
  return typeOf(v) === t;
}
function resolveRef(root, ref) {
  if (!ref.startsWith("#/")) throw new Error("Unsupported $ref: " + ref);
  return ref.slice(2).split("/").reduce((node, key) => node[key.replace(/~1/g, "/").replace(/~0/g, "~")], root);
}

// Returns a list of { pointer, keyword, message, missing } for `data` against `schema`.
function schemaValidate(schema, data) {
  const errors = [];
  const check = (sub, value, pointer) => {
    if (sub === true) return true;
    if (sub === false) { errors.push({ pointer, keyword: "false", message: "value is not allowed here" }); return false; }
    if (sub.$ref) return check(resolveRef(schema, sub.$ref), value, pointer);
    let ok = true;
    const fail = (keyword, message, extra) => { ok = false; errors.push(Object.assign({ pointer, keyword, message }, extra || {})); };

    if (sub.type !== undefined) {
      const types = Array.isArray(sub.type) ? sub.type : [sub.type];
      if (!types.some(t => matchesType(value, t))) { fail("type", "value at `" + pointer + "` is not " + (types.length > 1 ? "one of " + types.join(", ") : aOrAn(types[0]))); return false; }
    }
    if (sub.const !== undefined && value !== sub.const) fail("const", "value at `" + pointer + "` must be " + JSON.stringify(sub.const));
    if (sub.enum !== undefined && !sub.enum.includes(value)) fail("enum", "value at `" + pointer + "` is not one of: " + sub.enum.map(x => JSON.stringify(x)).join(", "));
    if (typeof value === "number") {
      if (sub.minimum !== undefined && value < sub.minimum) fail("minimum", "number at `" + pointer + "` is less than " + sub.minimum);
      if (sub.exclusiveMinimum !== undefined && value <= sub.exclusiveMinimum) fail("exclusiveMinimum", "number at `" + pointer + "` must be greater than " + sub.exclusiveMinimum);
    }
    if (typeof value === "string") {
      if (sub.minLength !== undefined && value.length < sub.minLength) fail("minLength", "string at `" + pointer + "` is shorter than " + sub.minLength + " character" + (sub.minLength === 1 ? "" : "s"));
      if (sub.pattern !== undefined && !new RegExp(sub.pattern).test(value)) fail("pattern", "string at `" + pointer + "` does not match " + sub.pattern);
    }
    if (Array.isArray(value)) {
      if (sub.minItems !== undefined && value.length < sub.minItems) fail("minItems", "array at `" + pointer + "` needs at least " + sub.minItems + " item" + (sub.minItems === 1 ? "" : "s"));
      if (sub.items !== undefined) value.forEach((v, i) => { if (!check(sub.items, v, pointer + "/" + i)) ok = false; });
    }
    if (isObj(value)) {
      const keys = Object.keys(value);
      if (sub.required) { const missing = sub.required.filter(k => !(k in value)); if (missing.length) fail("required", "object at `" + pointer + "` is missing required properties: " + missing.join(", "), { missing }); }
      if (sub.minProperties !== undefined && keys.length < sub.minProperties) fail("minProperties", "object at `" + pointer + "` needs at least " + sub.minProperties + " propert" + (sub.minProperties === 1 ? "y" : "ies"));
      if (sub.maxProperties !== undefined && keys.length > sub.maxProperties) fail("maxProperties", "object at `" + pointer + "` has more than " + sub.maxProperties + " propert" + (sub.maxProperties === 1 ? "y" : "ies"));
      const props = sub.properties || {};
      for (const k of keys) {
        const esc = k.replace(/~/g, "~0").replace(/\//g, "~1");
        if (k in props) { if (!check(props[k], value[k], pointer + "/" + esc)) ok = false; }
        else if (sub.additionalProperties === false) fail("additionalProperties", "object at `" + pointer + "` has an unexpected property: " + k, { property: k });
        else if (isObj(sub.additionalProperties)) { if (!check(sub.additionalProperties, value[k], pointer + "/" + esc)) ok = false; }
      }
    }
    if (sub.oneOf) {
      const saved = errors.length; let matches = 0;
      for (const alt of sub.oneOf) { const before = errors.length; if (check(alt, value, pointer)) matches++; errors.length = before; }
      errors.length = saved;
      if (matches !== 1) fail("oneOf", "value at `" + pointer + "` " + (matches ? "matches more than one" : "matches none") + " of the allowed shapes");
    }
    return ok;
  };
  check(schema, data, "");
  return errors;
}
function aOrAn(word) { return (/^[aeiou]/.test(word) ? "an " : "a ") + word; }

// ---------- references ----------

// Walks every rule in the refs table. visit receives
// { rule, id, segments, trail, owner } for each string value the rule reaches.
// trail is [{ node, key }, ...] from the root down to the value.
function walkRefs(world, refsTable, visit) {
  const rules = Array.isArray(refsTable) ? refsTable : (refsTable && refsTable.refs) || [];
  for (const rule of rules) {
    const segs = rule.path.split(".");
    const walk = (node, i, path, trail) => {
      if (i === segs.length) {
        if (typeof node !== "string") return;
        if (rule.when === "string" && typeof node !== "string") return;
        visit({ rule, id: node, segments: path, trail, owner: ownerOf(path) });
        return;
      }
      const seg = segs[i];
      if (seg === "*") {
        if (isObj(node)) for (const k of Object.keys(node)) walk(node[k], i + 1, path.concat(k), trail.concat({ node, key: k }));
        else if (Array.isArray(node)) node.forEach((v, idx) => walk(v, i + 1, path.concat(String(idx)), trail.concat({ node, key: idx })));
      } else if (isObj(node) && Object.prototype.hasOwnProperty.call(node, seg)) {
        walk(node[seg], i + 1, path.concat(seg), trail.concat({ node, key: seg }));
      }
    };
    walk(world, 0, [], []);
  }
}

// Which entity a dotted path belongs to: rooms.x... -> { type: "room", id: "x" }.
function ownerOf(segments) {
  const s = Array.isArray(segments) ? segments : String(segments).split(".");
  if (s[0] === "meta") return { type: "meta", id: "meta" };
  if (COLLECTIONS.includes(s[0]) && s[1] !== undefined) return { type: s[0].replace(/s$/, ""), id: s[1] };
  return { type: "meta", id: "meta" };
}

function referenceErrors(world, refsTable) {
  const out = [];
  walkRefs(world, refsTable, ({ rule, id, segments }) => {
    const path = segments.join(".");
    const kind = rule.kind;
    if (kind === "flag") return;
    if (kind === "topic") {
      let found;
      if (rule.scope === "npc") found = isObj(dig(world, ["npcs", segments[1], "dialogue", "topics", id]));
      else found = Object.values(isObj(world.npcs) ? world.npcs : {}).some(n => isObj(dig(n, ["dialogue", "topics", id])));
      if (!found) out.push({ code: "topic.missing", path, message: path + " names dialogue topic '" + id + "', which no matching NPC defines." });
      return;
    }
    if (isObj(dig(world, [kind, id]))) return;
    const code = path === "meta.starting_room" ? "starting_room.missing" : "ref.missing";
    out.push({ code, path, message: path + " refers to " + SINGULAR[kind] + " '" + id + "', which is not defined." });
  });
  return out;
}
function dig(obj, keys) { let n = obj; for (const k of keys) { if (!isObj(n)) return undefined; n = n[k]; } return n; }

// ---------- the contract ----------

function schemaCode(err) {
  const p = err.pointer, missing = err.missing || [];
  if (p === "/meta" && missing.includes("starting_room")) return "starting_room.missing";
  if (/^\/creatures\/[^/]+\/attack_condition/.test(p)) return "attack_condition.invalid";
  if (p.endsWith("/dice_roll/consume_on")) return "dice.consume_on";
  if (p.endsWith("/dice_roll") && missing.some(k => k === "on_success" || k === "on_failure")) return "dice.outcomes";
  return "schema.invalid";
}
function schemaMessage(err, path, world) {
  const m = /^\/items\/([^/]+)\/dice_roll/.exec(err.pointer);
  if (m && err.keyword === "required" && (err.missing || []).some(k => k === "on_success" || k === "on_failure")) return "Item '" + m[1] + "' has a dice_roll missing on_success or on_failure.";
  if (m && err.pointer.endsWith("/dice_roll/consume_on")) return "Item '" + m[1] + "' has invalid consume_on '" + dig(world, ["items", m[1], "dice_roll", "consume_on"]) + "' (must be: " + CONSUME_ON.join(", ") + ").";
  return path ? path + ": " + err.message : err.message;
}

// Returns [{ code, path, message }], the same shape and codes as ClassicGame::WorldValidator.
function validateContract(world, contract) {
  const w = isObj(world) ? world : {};
  const schemaErrors = schemaValidate(contract.schema, w).map(err => {
    const path = err.pointer.replace(/^\//, "").replace(/\//g, ".");
    return { code: schemaCode(err), path, message: schemaMessage(err, path, w) };
  });
  return schemaErrors.concat(referenceErrors(w, contract.refs));
}

const CONTRACT_CODES = ["schema.invalid", "starting_room.missing", "ref.missing", "topic.missing", "dice.outcomes", "dice.consume_on", "attack_condition.invalid"];

// ---------- lint ----------

const LINT_CODES = [
  "flag.never_set", "flag.never_checked",
  "exit.key_unplaced", "exit.flag_never_set", "exit.redundant_use_item", "room.unreachable", "room.describes_takeable",
  "item.unplaced", "item.message_without_text", "item.reveals_unknown_exit",
  "container.no_unlock", "container.locked_but_open", "item.contents_without_container", "item.consumable_not_takeable",
  "movement.bad_duration",
  "npc.unplaced", "dialogue.empty", "topic.no_text", "topic.no_keywords", "topic.gated_without_locked_text",
  "npc.gives_without_accepts",
  "creature.unplaced", "creature.condition_without_hostile"
];

// Everything worth telling an author: contract errors at level "error", plus
// warnings and infos about worlds that validate but will not play well.
// Returns [{ code, level, path, message, target: { type, id } }], the same
// codes and paths as ClassicGame::WorldLinter.
function lintWorld(world, contract) {
  const w = isObj(world) ? world : {};
  const out = validateContract(w, contract).map(e => ({ code: e.code, level: "error", path: e.path, message: e.message, target: ownerOf(e.path) }));
  const meta = isObj(w.meta) ? w.meta : {};
  const rooms = isObj(w.rooms) ? w.rooms : {};
  const items = isObj(w.items) ? w.items : {};
  const npcs = isObj(w.npcs) ? w.npcs : {};
  const creatures = isObj(w.creatures) ? w.creatures : {};
  const truthy = v => !(v === undefined || v === null || v === false || v === 0 || v === "");
  const itemName = id => (isObj(items[id]) && truthy(items[id].name) ? items[id].name : id);
  const report = (level, code, path, message, target) => out.push({ code, level, path, message, target: target || ownerOf(path) });

  const placed = { item: new Set(), npc: new Set(), creature: new Set() };
  const flags = {};
  walkRefs(w, contract.refs, ({ rule, id, segments }) => {
    const kind = rule.kind === "flag" || rule.kind === "topic" ? rule.kind : rule.kind.replace(/s$/, "");
    const mode = rule.mode || "ref";
    if (mode === "place" && placed[kind]) placed[kind].add(id);
    if (kind === "flag") { const e = flags[id] || (flags[id] = { set: [], check: [] }); e[mode === "set" ? "set" : "check"].push(segments.join(".")); }
  });
  const flagSet = f => !!(flags[f] && flags[f].set.length);

  const start = meta.starting_room;
  const reachable = new Set();
  if (truthy(rooms[start])) {
    const queue = [start]; reachable.add(start);
    while (queue.length) {
      const r = rooms[queue.shift()]; if (!isObj(r)) continue;
      const exits = isObj(r.exits) ? r.exits : {};
      for (const d in exits) { const ex = exits[d]; const to = typeof ex === "string" ? ex : (isObj(ex) ? ex.to : null); if (truthy(to) && truthy(rooms[to]) && !reachable.has(to)) { reachable.add(to); queue.push(to); } }
    }
  }

  for (const f in flags) {
    const e = flags[f]; const target = { type: "flag", id: f };
    if (!e.set.length) report("warn", "flag.never_set", e.check.slice().sort()[0], 'Flag "' + f + '" is checked but nothing ever sets it (' + e.check.join(", ") + ").", target);
    else if (!e.check.length) report("info", "flag.never_checked", e.set.slice().sort()[0], 'Flag "' + f + '" is set but never checked.', target);
  }

  const hiddenDirs = new Set();
  for (const rid in rooms) {
    const r = rooms[rid]; if (!isObj(r)) continue;
    const exits = isObj(r.exits) ? r.exits : {};
    for (const d in exits) {
      const ex = exits[d]; if (!isObj(ex)) continue;
      const base = "rooms." + rid + ".exits." + d;
      if (truthy(ex.hidden)) hiddenDirs.add(d);
      const keyField = truthy(ex.use_item) ? "use_item" : "requires"; const key = ex[keyField];
      if (truthy(key) && isObj(items[key]) && !placed.item.has(key)) report("warn", "exit.key_unplaced", base + "." + keyField, "Exit " + d + ' is locked and its key "' + itemName(key) + '" is never placed anywhere.');
      if (truthy(ex.requires_flag) && !flagSet(ex.requires_flag)) report("warn", "exit.flag_never_set", base + ".requires_flag", "Exit " + d + ' is gated on flag "' + ex.requires_flag + '", which nothing ever sets.');
      if (truthy(ex.use_item) && truthy(ex.requires) && ex.use_item === ex.requires) report("info", "exit.redundant_use_item", base, "Exit " + d + " sets both requires and use_item to the same item; requires alone already lets the player through.");
    }
    if (typeof r.description === "string" && Array.isArray(r.items)) {
      const text = r.description.toLowerCase();
      for (const iid of r.items) {
        const it = items[iid]; if (!isObj(it) || it.takeable === false) continue;
        const term = mentionedTerm(text, it);
        if (term) report("info", "room.describes_takeable", "rooms." + rid + ".description", 'Description mentions "' + term + '", but ' + itemName(iid) + " is takeable and the text will not change once it is taken.");
      }
    }
    if (truthy(start) && truthy(rooms[start]) && !reachable.has(rid)) report("warn", "room.unreachable", "rooms." + rid, "Room is unreachable from the starting room by any exit.");
  }

  for (const iid in items) {
    const it = items[iid]; if (!isObj(it)) continue;
    const base = "items." + iid;
    if (!placed.item.has(iid)) report("warn", "item.unplaced", base, "Item is never placed: not in a room, container, loot list, or given by an NPC.");
    if (isObj(it.on_use) && it.on_use.type === "message" && !truthy(it.on_use.text)) report("warn", "item.message_without_text", base + ".on_use", "on_use of type message has no text.");
    if (isObj(it.reveals_exit) && truthy(it.reveals_exit.direction) && !hiddenDirs.has(it.reveals_exit.direction)) report("warn", "item.reveals_unknown_exit", base + ".reveals_exit", 'reveals_exit "' + it.reveals_exit.direction + '" but no room has a hidden exit in that direction.');
